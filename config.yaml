# ============================================================
#  競合ホテル料金調査ツール  設定ファイル
# ============================================================
#  楽天トラベル空室検索API（VacantHotelSearch）を使って、
#  エリア・日付を指定するだけで、複数ホテルの客室タイプ別
#  販売単価（税・サービス料込み総額）を自動収集します。
# ============================================================

# ------------------------------------------------------------
# 1. 認証情報（楽天ウェブサービス）
#    https://webservice.rakuten.co.jp/app/create で無料取得
#    ※環境変数 RAKUTEN_APP_ID / RAKUTEN_ACCESS_KEY があれば
#      そちらが優先されます（このファイルに直書きしなくてOK）
# ------------------------------------------------------------
credentials:
  application_id: ""      # UUID形式（例: "5b5296f8-xxxx-xxxx-xxxx-xxxxxxxxxxxx"）
  access_key: ""          # 楽天ウェブサービスのアクセスキー（pk_...形式）
  affiliate_id: ""        # 任意（不要なら空欄のまま）
  origin: "https://localhost"  # アプリ登録時の「アプリケーションURL」と一致させる

# ------------------------------------------------------------
# 2. 検索の基本条件（調査プロトコルより）
# ------------------------------------------------------------
search:
  adult_num: 2            # 1室あたり大人2名
  room_num: 1            # 1室
  meal_preference: "room_only"   # room_only=素泊まり優先 / breakfast=朝食あり優先
  allow_breakfast_fallback: true # 素泊まりが無ければ朝食ありを採用し備考に「朝食込」
  exclude_non_refundable: true   # 「返金不可」を含むプランを可能な範囲で除外
  two_night_fallback: true       # 1泊で空室ゼロなら2泊で検索し1泊平均を算出
  request_interval_sec: 1.0      # API連続アクセス間隔（429対策）
  max_pages_per_hotel: 5         # 施設あたり取得ページ上限（プラン取りこぼし防止）

# ------------------------------------------------------------
# 3. 調査日程   ラベルと「1泊目のチェックイン日」を列挙
#    ※checkout は日数から自動計算されます
# ------------------------------------------------------------
dates:
  - label: "W1"     # ピーク
    checkin: "2026-08-07"
    nights: 1
  - label: "W2"     # ショルダー
    checkin: "2026-10-14"
    nights: 1
  - label: "W3"     # オフ
    checkin: "2026-12-09"
    nights: 1

# ------------------------------------------------------------
# 4. 調査対象ホテル
#    hotel_no が最も確実（find_hotel_no.py で名前から検索可能）。
#    hotel_no が空の場合は、下の area コードでエリア一括検索し、
#    name（部分一致）でフィルタして拾います。
# ------------------------------------------------------------
hotels:
  - name: "ハレクラニ沖縄"
    hotel_no: 172611
  - name: "ルネッサンス リゾート オキナワ"
    hotel_no: 54315
  - name: "シェラトン沖縄サンマリーナリゾート"
    hotel_no: 13554
  - name: "ANAインターコンチネンタル万座ビーチリゾート"
    hotel_no: 166320
  - name: "カフーリゾート フチャク コンド・ホテル"
    hotel_no: 78239
  - name: "ムーンビーチ"
    hotel_no: 15483
  - name: "ホテルモントレ沖縄"
    hotel_no: 141596
  - name: "ハイアットリージェンシー瀬良垣アイランド沖縄"
    hotel_no: 16123  # 166320はANAと重複のため16123を使用（要確認）

# ------------------------------------------------------------
# 5. エリア指定（hotel_no を使わないエリア一括検索モード用）
#    地区コードは楽天トラベル地区コードAPI(GetAreaClass)準拠。
#    沖縄本島リゾート帯の例。必要に応じて small を増減してください。
#    参照: https://webservice.rakuten.co.jp/explorer/api/Travel/GetAreaClass
# ------------------------------------------------------------
area:
  large_class_code: "japan"
  middle_class_code: "okinawa"
  # 対象の小区分（複数可）。空リストなら hotel_no モードのみで動作。
  small_class_codes:
    - "onna"        # 恩納村（多くのリゾートが該当）
    - "motobu"      # 本部・今帰仁
    - "yomitan"     # 読谷・残波

# ------------------------------------------------------------
# 6. グレード分類ルール（T1〜T4）
#    部屋名称(roomName)＋プラン名(planName)に対するキーワード判定。
#    上から順に評価し、最初に一致したグレードを採用します。
#    （＝より上位・特殊なグレードを先に置くこと）
# ------------------------------------------------------------
grades:
  - code: "T4"
    label: "ヴィラ/コンド"
    any_keywords: ["ヴィラ", "ビラ", "villa", "コンド", "condo", "キッチン", "kitchen", "戸建", "メゾネット"]
  - code: "T3"
    label: "スイート/プレミアム"
    any_keywords: ["スイート", "suite", "プレミア", "premium", "クラブ", "club", "ラウンジ", "lounge", "エグゼクティブ", "executive", "特別室", "テラス付"]
  - code: "T2"
    label: "デラックスOV"
    # オーシャンビュー保証。「ビュー」だけでなく「オーシャン/海」を要求
    any_keywords: ["オーシャンビュー", "オーシャン フロント", "オーシャンフロント", "ocean", "海側", "海景", "オーシャン"]
  - code: "T1"
    label: "スタンダード"
    # 何にも一致しなかった最安帯を T1 として扱う（フォールバック）
    any_keywords: []
    is_default: true

# ------------------------------------------------------------
# 7. 出力設定
# ------------------------------------------------------------
output:
  dir: "outputs"
  excel: true
  csv: true
  # 各(ホテル×日程×グレード)で「最安の1プラン」を代表値とする
  pick: "cheapest"
